
    <!DOCTYPE html>
    <html>
        <head>
            <meta charset="UTF-8">
            <title>Tabla de Símbolos</title>
            <style>
                body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f9f9f9; }
                h2 { color: #333; }
                table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
                th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
                th { background-color: #5cb85c; color: white; text-transform: uppercase; }
                tr:nth-child(even) { background-color: #f2f2f2; }
                tr:hover { background-color: #ddd; }
            </style>
        </head>
        <body>
            <h2>Tabla de Símbolos</h2>
            <table><thead><tr><th>ID</th><th>Tipo Símbolo</th><th>Tipo Dato</th><th>Ámbito</th><th>Línea</th><th>Columna</th></tr></thead><tbody></tbody></table>
        </body>
    </html>
